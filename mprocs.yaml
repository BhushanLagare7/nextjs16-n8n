# Runs the Next.js app alongside supporting dev services (Inngest, ngrok).
procs:
  ngrok:
    cmd: ["npm", "run", "ngrok:dev"]

  # Local Inngest dev server for background functions.
  inngest:
    cmd: ["npm", "run", "inngest:dev"]

  next:
    cmd: ["npm", "run", "dev"]
    env:
      INNGEST_DEV: "1"
